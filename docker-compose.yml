# GridWise LLM — Coolify deployment stack
#
# Deploy as: Coolify → New Resource → Docker Compose → point at this repo.
#
# The ONLY variable you set by hand in Coolify is OPENAI_API_KEY.
# Everything else is generated or defaulted here:
#
#   SERVICE_FQDN_GRIDWISE_8000  Coolify issues the public domain, provisions
#                               HTTPS, and routes it to container port 8000.
#   SERVICE_PASSWORD_REDIS      Coolify generates a strong password on first
#                               deploy and reuses it on every redeploy. It is
#                               injected into both services, so the cache URL
#                               and the Redis server always agree.
#
# NOTE ON PORTS: this file deliberately publishes NO host ports. Coolify's
# reverse proxy reaches the container over the internal network using the
# FQDN variable above. Publishing "8000:8000" here would bind the VPS host
# port and collide with anything else already listening on it — which is
# exactly the "port is already allocated" failure it would produce.

services:
  gridwise:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # Visible to the Coolify proxy and to Redis on the internal network only.
    expose:
      - "8000"

    environment:
      # Public URL + TLS, provisioned by Coolify for container port 8000.
      - SERVICE_FQDN_GRIDWISE_8000

      # The one secret you supply in the Coolify UI.
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # Model configuration — safe to change in the Coolify UI later.
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.6-luna}
      - OPENAI_REASONING_EFFORT=${OPENAI_REASONING_EFFORT:-low}

      # Latency budget, kept well inside the judge's 30 s request limit.
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-12}
      - OPENAI_MAX_ATTEMPTS=${OPENAI_MAX_ATTEMPTS:-3}
      - LLM_DEADLINE_SECONDS=${LLM_DEADLINE_SECONDS:-18}

      # Cache wiring. The password below is generated by Coolify.
      - REDIS_URL=redis://:${SERVICE_PASSWORD_REDIS}@redis:6379/0
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-86400}

      - PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    # Start order only — deliberately NOT `condition: service_healthy`.
    # The cache is an accelerator: the API reconnects to Redis on its own and
    # serves correctly without it, so gating startup on Redis health would
    # turn an optional dependency into a single point of failure.
    depends_on:
      - redis

    healthcheck:
      # stdlib probe: python:*-slim ships no curl or wget.
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4).status==200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    # The password is passed through the environment rather than interpolated
    # straight into the command line: it keeps the literal value out of the
    # container's process list, and gives Coolify an `environment:` entry to
    # detect the SERVICE_PASSWORD_ magic variable on.
    environment:
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}

    # Cache only: persistence is disabled, so a restart costs nothing but a
    # cold cache and no volume has to be managed or backed up.
    # `$$` escapes to a literal `$` for the container shell.
    command:
      - sh
      - -c
      - >
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --save ""
        --appendonly no
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
