name: Build & publish Docker fallback image

# The Participant Guide requires a pullable image with an exact tag or digest.
# Every push to main republishes :latest and a commit-pinned tag, and the
# digest is printed in the job summary for the submission form.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        # No API key: the suite mocks the provider and must stay offline.
        run: pytest tests/ -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image
        # Proves the image starts and /health answers with no API key present,
        # which is exactly how a judge would run the fallback path.
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          docker run -d --name gridwise-smoke -p 8000:8000 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health | grep -q '"ok"'; then
              echo "Health check passed after ${i}s"
              docker rm -f gridwise-smoke
              exit 0
            fi
            sleep 1
          done
          echo "Health check never passed:"
          docker logs gridwise-smoke
          docker rm -f gridwise-smoke
          exit 1

      - name: Publish pull reference to the job summary
        run: |
          {
            echo "### Docker fallback image"
            echo
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Tags: \`${{ steps.meta.outputs.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
